<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Harness PoC</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#2563eb; --tool:#f5f5f4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#44403c; --accent:#60a5fa; --tool:#292524; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); display:grid; grid-template-columns: 1fr 260px; height:100vh; }
  main { display:flex; flex-direction:column; min-width:0; }
  #log { flex:1; overflow:auto; padding:16px; }
  .msg { max-width:820px; margin:0 auto 14px; white-space:pre-wrap; word-wrap:break-word; }
  .user { font-weight:600; }
  .tool { font:12px ui-monospace, monospace; color:var(--muted); background:var(--tool); padding:4px 8px; border-radius:6px; margin:4px auto; max-width:820px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); max-width:852px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; height:56px; font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; }
  button, label.btn { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--accent); color:#fff; cursor:pointer; }
  label.btn { background:transparent; color:var(--fg); }
  aside { border-left:1px solid var(--line); padding:16px; overflow:auto; font-size:13px; }
  aside a { color:var(--accent); display:block; word-break:break-all; margin:4px 0; }
  input[type=text] { width:100%; font:inherit; padding:6px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; }
  .conn { border:1px solid var(--line); border-radius:8px; padding:10px; margin:6px 0; }
  .conn header { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .conn p { margin:4px 0; color:var(--muted); }
  .conn .state { font-size:12px; }
  .conn .on { color:#15803d; }
  .conn button { padding:4px 10px; font-size:13px; }
  .conn button.off { background:transparent; color:var(--fg); }
  #notice { font-size:12px; margin:4px 0; }
  .mem h4 { margin:8px 0 2px; font-size:12px; color:var(--muted); font-weight:600; }
  .mem li { display:flex; gap:6px; align-items:flex-start; margin:3px 0; }
  .mem ul { list-style:none; padding:0; margin:0; }
  .mem li span { flex:1; }
  .mem li button, .mem .clear { background:transparent; color:var(--muted); border:none; padding:0 4px; font-size:13px; cursor:pointer; }
  .mem .clear { text-decoration:underline; padding:0; margin-top:6px; }
  .mem .rel { color:var(--muted); }
  .mem .subj { margin:6px 0 1px; font-weight:600; }
  .mem .meta { font-size:11px; color:var(--muted); }
  #graphbtn { background:transparent; color:var(--accent); border:1px solid var(--line); padding:3px 8px; font-size:12px; margin-top:4px; }
  dialog#graph { width:min(960px, 94vw); height:min(680px, 88vh); padding:0; overflow:hidden; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
  dialog#graph header { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); font-size:13px; }
  dialog#graph svg { width:100%; height:calc(100% - 46px); display:block; }
  dialog#graph .legend span { margin-right:10px; }
  dialog#graph .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; } aside { display:none; } }
</style>
</head>
<body>
<main>
  <div id="log"></div>
  <form id="f">
    <label class="btn" title="Enviar arquivo">📎<input id="file" type="file" hidden></label>
    <textarea id="q" placeholder="Pergunte algo… (Enter envia, Shift+Enter quebra linha)"></textarea>
    <button>Enviar</button>
  </form>
</main>
<aside>
  <strong>Conectores</strong>
  <div id="notice"></div>
  <div id="connectors"><em>carregando…</em></div>
  <p><strong>Memória</strong></p>
  <div id="memory" class="mem"><em>carregando…</em></div>
  <div id="graphmem" class="mem"></div>
  <div id="skillmem" class="mem"></div>
  <p><strong>Skills fixadas</strong></p>
  <input id="skills" type="text" placeholder="ex.: pdf, research">
  <p><strong>Arquivos</strong></p>
  <div id="files"><em>nenhum</em></div>
  <p><strong>Meus arquivos</strong> <span class="meta" style="font-size:11px;color:var(--muted)">(30 dias sem uso e são apagados)</span></p>
  <div id="library" class="mem"><em>carregando…</em></div>
  <p><button id="new" type="button">Nova conversa</button></p>
</aside>
<dialog id="graph">
  <header><strong>Grafo da memória</strong><span class="legend" id="legend"></span><button type="button" id="graphclose" class="off" style="background:transparent;color:var(--fg)">Fechar</button></header>
  <svg id="graphsvg" role="img" aria-label="Grafo de entidades e relações lembradas"></svg>
</dialog>
<script>
let conv = null;
const log = document.getElementById("log");
const add = (cls, text) => { const d = document.createElement("div"); d.className = cls; d.textContent = text; log.append(d); log.scrollTop = log.scrollHeight; return d; };
const renderFiles = (files) => {
  const box = document.getElementById("files"); box.innerHTML = "";
  if (!files.length) return box.innerHTML = "<em>nenhum</em>";
  for (const f of files) {
    const a = document.createElement("a");
    a.href = `api/conversations/${conv}/files/${encodeURIComponent(f.path)}`;
    a.textContent = `${f.path} (${Math.ceil(f.size/1024)} KB)`;
    box.append(a);
  }
};
const notice = (t) => { document.getElementById("notice").textContent = t; };
async function loadConnectors() {
  const box = document.getElementById("connectors");
  const r = await fetch("api/connectors"); const list = r.ok ? await r.json() : [];
  box.textContent = "";
  if (!list.length) { box.innerHTML = "<em>nenhum disponível</em>"; return; }
  for (const c of list) {
    const card = document.createElement("div"); card.className = "conn";
    const head = document.createElement("header");
    const name = document.createElement("strong"); name.textContent = c.name;
    const btn = document.createElement("button"); btn.type = "button";
    btn.textContent = c.connected ? "Desconectar" : "Conectar";
    if (c.connected) btn.className = "off";
    btn.onclick = async () => {
      if (!c.connected) { location.href = `api/connectors/${c.id}/connect`; return; }
      if (!confirm(`Desconectar ${c.name}? O acesso será revogado.`)) return;
      btn.disabled = true;
      await fetch(`api/connectors/${c.id}`, { method: "DELETE" });
      notice(`${c.name} desconectado.`); loadConnectors();
    };
    head.append(name, btn);
    const desc = document.createElement("p"); desc.textContent = c.summary;
    const st = document.createElement("div"); st.className = "state" + (c.connected ? " on" : "");
    st.textContent = c.connected ? `Conectado ${c.account}${c.readOnly ? " · somente leitura" : ""}` : "Não conectado";
    card.append(head, desc, st); box.append(card);
  }
}
async function loadMemory() {
  const box = document.getElementById("memory");
  const r = await fetch("api/memory"); const m = r.ok ? await r.json() : { user: [], memory: [] };
  box.textContent = "";
  const total = m.user.length + m.memory.length;
  if (!total) { box.innerHTML = "<em>vazia. O assistente guarda aqui o que você contar sobre você e seus projetos.</em>"; return; }
  for (const [target, label] of [["user", "Sobre você"], ["memory", "Fatos e decisões"]]) {
    if (!m[target].length) continue;
    const h = document.createElement("h4"); h.textContent = label; box.append(h);
    const ul = document.createElement("ul");
    for (const entry of m[target]) {
      const li = document.createElement("li");
      const t = document.createElement("span"); t.textContent = entry;
      const del = document.createElement("button"); del.type = "button"; del.title = "Esquecer"; del.textContent = "×";
      del.onclick = async () => { await fetch(`api/memory?target=${target}&text=${encodeURIComponent(entry)}`, { method: "DELETE" }); loadMemory(); };
      li.append(t, del); ul.append(li);
    }
    box.append(ul);
  }
  const clear = document.createElement("button"); clear.type = "button"; clear.className = "clear"; clear.textContent = "Apagar toda a memória";
  clear.onclick = async () => { if (confirm("Apagar tudo o que o assistente lembra sobre você?")) { await fetch("api/memory", { method: "DELETE" }); loadMemory(); } };
  box.append(clear);
}
const KIND_LABELS = { person:"pessoa", team:"time", project:"projeto", company:"empresa", product:"produto", topic:"tema", document:"documento", decision:"decisão", other:"outro" };
const KIND_COLORS = { person:"#2563eb", team:"#7c3aed", project:"#059669", company:"#d97706", product:"#0891b2", topic:"#db2777", document:"#64748b", decision:"#dc2626", other:"#78716c" };
let graphData = { recent: [] };
async function loadGraph() {
  const box = document.getElementById("graphmem");
  const r = await fetch("api/memory/graph"); graphData = r.ok ? await r.json() : { entities: 0, facts: 0, recent: [] };
  box.textContent = "";
  if (!graphData.facts) return;
  const h = document.createElement("h4"); h.textContent = `Relações (${graphData.facts} fatos, ${graphData.entities} entidades)`; box.append(h);
  const btn = document.createElement("button"); btn.type = "button"; btn.id = "graphbtn"; btn.textContent = "Ver grafo"; btn.onclick = showGraph; box.append(btn);
  const bySubj = new Map();
  for (const f of graphData.recent.slice(0, 30)) { if (!bySubj.has(f.subject)) bySubj.set(f.subject, []); bySubj.get(f.subject).push(f); }
  for (const [subj, facts] of bySubj) {
    const d = document.createElement("div"); d.className = "subj"; d.textContent = subj; box.append(d);
    const ul = document.createElement("ul");
    for (const f of facts) {
      const li = document.createElement("li");
      const t = document.createElement("span");
      const rel = document.createElement("span"); rel.className = "rel"; rel.textContent = `${f.relation} → `;
      const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = f.note ? `${f.note} · ${f.at}` : f.at;
      t.append(rel, document.createTextNode(f.object), meta);
      const del = document.createElement("button"); del.type = "button"; del.title = "Esquecer este fato"; del.textContent = "×";
      del.onclick = async () => { await fetch(`api/memory/graph/${f.id}`, { method: "DELETE" }); loadGraph(); };
      li.append(t, del); ul.append(li);
    }
    box.append(ul);
  }
}
async function loadLibrary() {
  const box = document.getElementById("library");
  const r = await fetch("api/files"); const list = r.ok ? await r.json() : [];
  box.textContent = "";
  const others = list.filter((f) => f.conversation !== conv).slice(0, 15);
  if (!others.length) { box.innerHTML = "<em>nenhum de outras conversas</em>"; return; }
  const ul = document.createElement("ul");
  for (const f of others) {
    const li = document.createElement("li");
    const t = document.createElement("span");
    const n = document.createElement("span"); n.textContent = f.name;
    const days = f.expiresAt ? Math.max(0, Math.ceil((Date.parse(f.expiresAt) - Date.now()) / 86400000)) : null;
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = `${f.kind === "upload" ? "enviado" : "gerado"} ${f.modified?.slice(0, 10) ?? ""}${f.title ? " · " + f.title.slice(0, 40) : ""}${days !== null ? ` · expira em ${days} d` : ""}`;
    t.append(n, meta);
    const use = document.createElement("button"); use.type = "button"; use.title = "Usar nesta conversa"; use.textContent = "Usar";
    use.style.cssText = "color:var(--accent);font-size:12px";
    use.onclick = async () => {
      conv ??= crypto.randomUUID();
      const res = await fetch(`api/conversations/${conv}/attach`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ file_id: f.id }) });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) { add("tool", `erro: ${j.error ?? res.status}`); return; }
      add("tool", `arquivo anexado: ${j.path}`);
      const q = document.getElementById("q"); q.value = (q.value ? q.value + "\n" : "") + `(arquivo anexado: ${j.path}) `;
      const fl = await fetch(`api/conversations/${conv}/files`); if (fl.ok) renderFiles(await fl.json());
      loadLibrary();
    };
    li.append(t, use); ul.append(li);
  }
  box.append(ul);
}
async function loadSkills() {
  const box = document.getElementById("skillmem");
  const r = await fetch("api/memory/skills"); const list = r.ok ? await r.json() : [];
  box.textContent = "";
  if (!list.length) return;
  const h = document.createElement("h4"); h.textContent = `Procedimentos (${list.length})`; box.append(h);
  const ul = document.createElement("ul");
  for (const s of list) {
    const li = document.createElement("li");
    const t = document.createElement("span");
    const n = document.createElement("strong"); n.textContent = `my-${s.name}`;
    const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = `${s.description} · ${s.updatedAt.slice(0, 10)}`;
    t.append(n, meta);
    const del = document.createElement("button"); del.type = "button"; del.title = "Apagar procedimento"; del.textContent = "×";
    del.onclick = async () => { if (confirm(`Apagar o procedimento my-${s.name}?`)) { await fetch(`api/memory/skills/${s.name}`, { method: "DELETE" }); loadSkills(); } };
    li.append(t, del); ul.append(li);
  }
  box.append(ul);
}
function showGraph() {
  const dlg = document.getElementById("graph"); dlg.showModal();
  const svg = document.getElementById("graphsvg"); svg.textContent = "";
  const W = svg.clientWidth || 900, H = svg.clientHeight || 600, NS = "http://www.w3.org/2000/svg";
  const nodes = new Map(), edges = [];
  const node = (name) => { if (!nodes.has(name)) nodes.set(name, { name, kind: "other", x: 0, y: 0, vx: 0, vy: 0, deg: 0 }); return nodes.get(name); };
  for (const f of graphData.recent) { const a = node(f.subject), b = node(f.object); a.deg++; b.deg++; edges.push({ a, b, rel: f.relation }); }
  for (const f of graphData.recent) { if (f.subjectKind) nodes.get(f.subject).kind = f.subjectKind; if (f.objectKind) nodes.get(f.object).kind = f.objectKind; }
  const list = [...nodes.values()].sort((p, q) => q.deg - p.deg);
  list.forEach((p, i) => { const a = i * 2.39996, r = 40 * Math.sqrt(i); p.x = Math.cos(a) * r; p.y = Math.sin(a) * r; });   // deterministic start
  for (let it = 0; it < 400; it++) {   // force layout: repulsion, springs, weak gravity
    for (const p of list) for (const q of list) { if (p === q) continue; const dx = p.x - q.x, dy = p.y - q.y, d2 = dx*dx + dy*dy + 0.01, d = Math.sqrt(d2), f = 9000 / d2; p.vx += dx / d * f; p.vy += dy / d * f; }
    for (const e of edges) { const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y, d = Math.sqrt(dx*dx + dy*dy) + 0.01, f = (d - 190) * 0.03; e.a.vx += dx/d*f; e.a.vy += dy/d*f; e.b.vx -= dx/d*f; e.b.vy -= dy/d*f; }
    for (const p of list) { p.vx -= p.x * 0.002; p.vy -= p.y * 0.002; p.x += p.vx * 0.5; p.y += p.vy * 0.5; p.vx *= 0.6; p.vy *= 0.6; }
  }
  // Fit to the viewport, keeping room for labels.
  const xs = list.map((p) => p.x), ys = list.map((p) => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const k = Math.min((W - 200) / Math.max(maxX - minX, 1), (H - 90) / Math.max(maxY - minY, 1), 1.6);
  for (const p of list) { p.x = W/2 + (p.x - (minX + maxX)/2) * k; p.y = H/2 + (p.y - (minY + maxY)/2) * k; }
  const el = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; svg.append(e); return e; };
  const defs = el("defs", {}); const mk = document.createElementNS(NS, "marker");
  for (const [k, v] of Object.entries({ id: "arr", viewBox: "0 0 10 10", refX: "20", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" })) mk.setAttribute(k, v);
  const path = document.createElementNS(NS, "path"); path.setAttribute("d", "M0,0 L10,5 L0,10 z"); path.setAttribute("fill", "currentColor"); path.setAttribute("opacity", "0.45"); mk.append(path); defs.append(mk);
  for (const e of edges) {
    el("line", { x1: e.a.x, y1: e.a.y, x2: e.b.x, y2: e.b.y, stroke: "currentColor", "stroke-opacity": "0.25", "marker-end": "url(#arr)" });
    const t = el("text", { x: (e.a.x + e.b.x)/2, y: (e.a.y + e.b.y)/2 - 4, "text-anchor": "middle", "font-size": "11", fill: "currentColor", opacity: "0.7", "paint-order": "stroke", stroke: "var(--bg)", "stroke-width": "4" }, e.rel);
  }
  for (const p of list) {
    el("circle", { cx: p.x, cy: p.y, r: 6 + Math.min(p.deg, 8) * 1.5, fill: KIND_COLORS[p.kind] ?? KIND_COLORS.other, stroke: "var(--bg)", "stroke-width": "2" });
    el("text", { x: p.x, y: p.y + 24 + Math.min(p.deg, 8), "text-anchor": "middle", "font-size": "12", "font-weight": p.deg > 2 ? "600" : "400", fill: "currentColor", "paint-order": "stroke", stroke: "var(--bg)", "stroke-width": "4" }, p.name);
  }
  const kinds = [...new Set(list.map((p) => p.kind))];
  const legend = document.getElementById("legend"); legend.textContent = "";
  for (const k of kinds) { const sp = document.createElement("span"); const i = document.createElement("i"); i.style.background = KIND_COLORS[k] ?? KIND_COLORS.other; sp.append(i, document.createTextNode(KIND_LABELS[k] ?? k)); legend.append(sp); }
}
document.getElementById("graphclose").onclick = () => document.getElementById("graph").close();
loadMemory(); loadGraph(); loadSkills(); loadLibrary();
{
  const p = new URLSearchParams(location.search);
  if (p.get("connector")) {
    notice(p.get("status") === "ok" ? `${p.get("connector")} conectado. As tools aparecem na próxima mensagem.` : `Falha ao conectar ${p.get("connector")}: ${p.get("status")}`);
    history.replaceState(null, "", location.pathname);
  }
  loadConnectors();
}
document.getElementById("new").onclick = () => { conv = null; log.innerHTML = ""; renderFiles([]); loadLibrary(); };
document.getElementById("file").onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  conv ??= crypto.randomUUID();
  add("tool", `enviando ${file.name}…`);
  const r = await fetch(`api/conversations/${conv}/uploads/${encodeURIComponent(file.name)}`, { method: "POST", body: file });
  const j = await r.json();
  add("tool", r.ok ? `arquivo em ${j.path}` : `erro: ${j.error}`);
  const q = document.getElementById("q"); q.value = (q.value ? q.value + "\n" : "") + `(arquivo enviado: ${j.path}) `;
  e.target.value = "";
};
const q = document.getElementById("q");
q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } });
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const message = q.value.trim(); if (!message) return;
  q.value = "";
  add("msg user", message);
  const skills = document.getElementById("skills").value.split(",").map(s => s.trim()).filter(Boolean);
  const out = add("msg", "");
  const res = await fetch("api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ conversationId: conv ?? undefined, message, skills }) });
  if (!res.ok) { const j = await res.json().catch(() => ({})); out.textContent = res.status === 409 ? "Esta conversa está respondendo em outra aba ou dispositivo. Aguarde terminar e tente de novo." : `erro: ${j.error ?? res.status}`; return; }
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const line = buf.slice(0, i); buf = buf.slice(i + 2);
      if (!line.startsWith("data: ")) continue;
      const ev = JSON.parse(line.slice(6));
      if (ev.type === "start") conv = ev.conversationId;
      else if (ev.type === "delta") { out.textContent += ev.text; log.scrollTop = log.scrollHeight; }
      else if (ev.type === "tool") log.insertBefore(Object.assign(document.createElement("div"), { className: "tool", textContent: `⚙ ${ev.name} ${JSON.stringify(ev.args).slice(0, 160)}` }), out);
      else if (ev.type === "memory") add("tool", `memória: ${ev.saved.join(" · ")}`);
      else if (ev.type === "done") { renderFiles(ev.files); loadMemory(); loadGraph(); loadSkills(); loadLibrary(); }
      else if (ev.type === "error") add("tool", `erro: ${ev.message}`);
    }
  }
};
</script>
</body>
</html>
