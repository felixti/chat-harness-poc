# Chat API: Pi agent harness. Read-only root, /tmp only, no subprocess (enforced in code too).
# Connector secrets from Key Vault: the master key that seals user tokens, and the GitHub OAuth
# App client secret. Optional so the pod still starts before they exist (connectors hidden).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-connectors
  namespace: chat
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-keyvault}
  target: {name: chat-connectors, creationPolicy: Owner}
  data:
  - secretKey: master-key
    remoteRef: {key: connectors-master-key}
  - secretKey: github-client-secret
    remoteRef: {key: github-oauth-client-secret}
  - secretKey: microsoft-client-secret
    remoteRef: {key: microsoft-oauth-client-secret}
  - secretKey: azuredevops-client-secret
    remoteRef: {key: azuredevops-oauth-client-secret}
  - secretKey: crawlforge-api-key
    remoteRef: {key: crawlforge-api-key}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chat-api
  namespace: chat
  annotations:
    # infra/ output chat_api_client_id: Blob Data Contributor on chat-workspaces and chat-credentials only.
    azure.workload.identity/client-id: 43db3c04-6f6a-4873-ac7b-e5d9cd50cf69
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: chat-api
  namespace: chat
spec:
  selector: {app: chat-api}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
  namespace: chat
spec:
  replicas: 2   # stateless: Blob is the only source of truth, any pod serves any turn
  selector: {matchLabels: {app: chat-api}}
  template:
    metadata:
      labels:
        app: chat-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: chat-api
      nodeSelector: {agentplatform.io/pool: platform}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: chat-api
        image: ghcr.io/felixti/chat-harness-chat-api:804e06e3fec542a8b0ef14bb25a74ab37ed5e8f0
        env:
        - {name: MONGO_URL, value: "mongodb://ferret@ferretdb:27017/chat"}   # password from /var/run/secrets/chat/db-password
        - {name: BLOB_ACCOUNT_URL, value: "https://stagentpocjt75.blob.core.windows.net"}
        - {name: BLOB_CONTAINER, value: chat-workspaces}
        - {name: PARSER_URL, value: "http://parser"}
        - {name: LLM_BASE_URL, value: "http://llm-gateway.envoy-gateway-system.svc/api/v1"}
        - {name: LLM_MODEL, value: "deepseek/deepseek-v4.1-flash-1017"}   # default; users pick others in the portal (LLM_MODELS, H57)
        - {name: USD_BRL, value: "5.40"}   # cost shown in the portal (H58); update with the month's rate
        - {name: IMAGE_MODEL, value: "minimax/minimax-h3-image"}   # generate_image at 1K; fallback google/gemini-3.1-flash-lite-image
        - {name: BRAVE_MCP_URL, value: "http://brave-mcp/mcp"}
        - {name: CRAWLFORGE_MCP_URL, value: "https://crawlforge.felixtek.cloud/mcp"}   # key: Key Vault crawlforge-api-key (H60)
        - {name: PUBLIC_URL, value: "https://chat.20-121-208-105.sslip.io"}
        - {name: CONNECTORS_CONTAINER, value: chat-credentials}
        - {name: MEMORY_CONTAINER, value: chat-memory}
        - {name: GITHUB_CLIENT_ID, value: "Ov23lipiqkWBqCka0Sgk"}   # GitHub OAuth App client ID (public)
        - {name: AZDO_CLIENT_ID, value: "350bddb7-1b60-4df7-b643-4b7d6461b851"}   # Entra app chat-harness-azure-devops (single tenant)
        - {name: AZDO_TENANT, value: "5f9bf155-4fca-4d0c-8201-ca5e6100f66e"}
        - {name: AZDO_ORG, value: "felix-demo"}
        - {name: AZDO_MCP_READONLY, value: "false"}   # write scopes; every write waits for the user's approval (H46)
        - {name: MICROSOFT_CLIENT_ID, value: "0ea6ada6-2ef2-43fe-b6f2-ba6433182343"}   # Entra app chat-harness-microsoft-files (work + personal accounts)
        ports: [{name: http, containerPort: 8080}]
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
        resources:
          requests: {cpu: 100m, memory: 384Mi}
          limits: {memory: 1536Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
        # Secrets as files, not env vars: kept out of /proc/self/environ; the agent's file tools
        # are confined to the turn workspace and cannot read this path either.
        - {name: secrets, mountPath: /var/run/secrets/chat, readOnly: true}
      volumes:
      - name: secrets
        projected:
          defaultMode: 0440   # group-readable: fsGroup 65532 is the app user
          sources:
          - secret:
              name: chat-db
              items: [{key: password, path: db-password}]
          - secret:
              name: chat-connectors
              optional: true
              items: [{key: master-key, path: connectors-master-key}, {key: github-client-secret, path: github-client-secret}, {key: microsoft-client-secret, path: microsoft-client-secret}, {key: azuredevops-client-secret, path: azuredevops-client-secret}, {key: crawlforge-api-key, path: crawlforge-api-key}]
      # Scratch for one turn at a time; Blob is the truth, losing the pod loses nothing.
      - {name: tmp, emptyDir: {sizeLimit: 4Gi}}
