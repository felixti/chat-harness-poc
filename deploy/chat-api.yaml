# Chat API: Pi agent harness. Read-only root, /tmp only, no subprocess (enforced in code too).
# Connector secrets from Key Vault: the master key that seals user tokens, and the GitHub OAuth
# App client secret. Optional so the pod still starts before they exist (connectors hidden).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-connectors
  namespace: chat
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-keyvault}
  target: {name: chat-connectors, creationPolicy: Owner}
  data:
  - secretKey: master-key
    remoteRef: {key: connectors-master-key}
  - secretKey: github-client-secret
    remoteRef: {key: github-oauth-client-secret}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chat-api
  namespace: chat
  annotations:
    # infra/ output chat_api_client_id: Blob Data Contributor on chat-workspaces and chat-credentials only.
    azure.workload.identity/client-id: 43db3c04-6f6a-4873-ac7b-e5d9cd50cf69
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: chat-api
  namespace: chat
spec:
  selector: {app: chat-api}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
  namespace: chat
spec:
  replicas: 1
  selector: {matchLabels: {app: chat-api}}
  template:
    metadata:
      labels:
        app: chat-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: chat-api
      nodeSelector: {agentplatform.io/pool: platform}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: chat-api
        image: ghcr.io/felixti/chat-harness-chat-api:5fdd84c99b87f6414430b2817e90333c701a2a74
        env:
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: chat-db, key: password}}
        - {name: MONGO_URL, value: "mongodb://ferret:$(DB_PASSWORD)@ferretdb:27017/chat"}
        - {name: BLOB_ACCOUNT_URL, value: "https://stagentpocjt75.blob.core.windows.net"}
        - {name: BLOB_CONTAINER, value: chat-workspaces}
        - {name: PARSER_URL, value: "http://parser"}
        - {name: LLM_BASE_URL, value: "http://llm-gateway.envoy-gateway-system.svc/api/v1"}
        - {name: LLM_MODEL, value: "deepseek/deepseek-v4.1-flash-1017"}   # vision: reviews slide previews
        - {name: IMAGE_MODEL, value: "minimax/minimax-h3-image"}   # generate_image at 1K; fallback google/gemini-3.1-flash-lite-image
        - {name: BRAVE_MCP_URL, value: "http://brave-mcp/mcp"}
        - {name: PUBLIC_URL, value: "https://chat.20-121-208-105.sslip.io"}
        - {name: CONNECTORS_CONTAINER, value: chat-credentials}
        - name: CONNECTORS_MASTER_KEY
          valueFrom: {secretKeyRef: {name: chat-connectors, key: master-key, optional: true}}
        - {name: GITHUB_CLIENT_ID, value: ""}   # GitHub OAuth App client ID (public)
        - name: GITHUB_CLIENT_SECRET
          valueFrom: {secretKeyRef: {name: chat-connectors, key: github-client-secret, optional: true}}
        ports: [{name: http, containerPort: 8080}]
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
        resources:
          requests: {cpu: 100m, memory: 384Mi}
          limits: {memory: 1536Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
      # Workspaces are a cache of Blob: losing the pod loses nothing.
      - {name: tmp, emptyDir: {sizeLimit: 4Gi}}
