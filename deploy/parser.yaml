# Document -> markdown (markitdown). Stand-in for the company's intelligent parser service.
apiVersion: v1
kind: Service
metadata:
  name: parser
  namespace: chat
spec:
  selector: {app: parser}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  namespace: chat
spec:
  replicas: 1
  selector: {matchLabels: {app: parser}}
  template:
    metadata:
      labels: {app: parser}
    spec:
      nodeSelector: {agentplatform.io/pool: platform}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: parser
        image: ghcr.io/felixti/chat-harness-parser:2021e83aa9366e09e1f547f6e16c090c9e0eaae0
        ports: [{name: http, containerPort: 8080}]
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
        resources:
          requests: {cpu: 50m, memory: 192Mi}
          limits: {memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
      - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
